services:
  postgres:
    image: postgres:15
    container_name: pv_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: portfolio
      POSTGRES_USER_FILE: /run/secrets/postgres_app_user
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_app_password
      TZ: UTC
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$(cat /run/secrets/postgres_app_user)" -d portfolio
      interval: 10s
      timeout: 5s
      retries: 5
    secrets:
      - postgres_app_user
      - postgres_app_password

  grafana:
    image: grafana/grafana:10.4.3
    container_name: pv_grafana
    restart: unless-stopped
    profiles:
      - legacy
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
    environment:
      GF_SECURITY_ADMIN_USER__FILE: /run/secrets/grafana_admin_user
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_USERS_DEFAULT_THEME: "light"
      GF_SERVER_DOMAIN: "localhost"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    entrypoint:
      - /bin/sh
      - -c
      - |
        export PORTFOLIO_DB_USER="$(cat /run/secrets/postgres_app_user)"
        export PORTFOLIO_DB_PASSWORD="$(cat /run/secrets/postgres_app_password)"
        exec /run.sh
    secrets:
      - postgres_app_user
      - postgres_app_password
      - grafana_admin_user
      - grafana_admin_password

  etl:
    build:
      context: ./etl
    image: portfolio-etl:latest
    container_name: pv_etl
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORTFOLIO_DB_HOST: postgres
      PORTFOLIO_DB_PORT: "5432"
      PORTFOLIO_DB_NAME: portfolio
      PORTFOLIO_DB_USER_FILE: /run/secrets/postgres_app_user
      PORTFOLIO_DB_PASSWORD_FILE: /run/secrets/postgres_app_password
      IBKR_FLEX_TOKEN_FILE: /run/secrets/ibkr_flex_token
      IBKR_FLEX_QUERY_ID_FILE: /run/secrets/ibkr_flex_query_id
      FLEX_ARCHIVE_DIR: /data/flex_archive
      ETL_LOG_LEVEL: INFO
      ETL_RUN_MODE: scheduler
      YF_CACHE_DIR: /tmp/yfinance_cache
    volumes:
      - etl_data:/data
      - ./imports:/data/imports
    secrets:
      - postgres_app_user
      - postgres_app_password
      - ibkr_flex_token
      - ibkr_flex_query_id

  visualizer-api:
    build:
      context: ./services/api
    image: portfolio-visualizer-api:latest
    container_name: pv_visualizer_api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORTFOLIO_DB_HOST: postgres
      PORTFOLIO_DB_PORT: "5432"
      PORTFOLIO_DB_NAME: portfolio
      PORTFOLIO_DB_USER_FILE: /run/secrets/postgres_app_user
      PORTFOLIO_DB_PASSWORD_FILE: /run/secrets/postgres_app_password
      VISUALIZER_BASIC_AUTH_USER_FILE: /run/secrets/visualizer_basic_auth_user
      VISUALIZER_BASIC_AUTH_PASSWORD_FILE: /run/secrets/visualizer_basic_auth_password
      VISUALIZER_LOG_LEVEL: INFO
      VISUALIZER_BASE_CURRENCY: EUR
    ports:
      - "8080:8080"
    secrets:
      - postgres_app_user
      - postgres_app_password
      - visualizer_basic_auth_user
      - visualizer_basic_auth_password

  visualizer-web:
    build:
      context: ./services/web
      target: production
    image: portfolio-visualizer-web:latest
    container_name: pv_visualizer_web
    restart: unless-stopped
    depends_on:
      visualizer-api:
        condition: service_started
    ports:
      - "8120:80"

  visualizer-web-dev:
    build:
      context: ./services/web
      target: dev
    image: portfolio-visualizer-web-dev:latest
    container_name: pv_visualizer_web_dev
    profiles:
      - dev
    depends_on:
      visualizer-api:
        condition: service_started
    ports:
      - "4200:4200"
    volumes:
      - ./services/web:/app
      - /app/node_modules
    environment:
      NODE_ENV: development

  mcp:
    build:
      context: ./etl
    image: portfolio-etl:latest
    container_name: pv_mcp
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORTFOLIO_DB_HOST: postgres
      PORTFOLIO_DB_PORT: "5432"
      PORTFOLIO_DB_NAME: portfolio
      PORTFOLIO_DB_USER_FILE: /run/secrets/postgres_app_user
      PORTFOLIO_DB_PASSWORD_FILE: /run/secrets/postgres_app_password
      MCP_LOG_LEVEL: INFO
      MCP_TRANSPORT: streamable-http
      MCP_HOST: 0.0.0.0
      MCP_PORT: "8000"
    entrypoint:
      - python
      - -m
      - app.mcp_server
    secrets:
      - postgres_app_user
      - postgres_app_password
    ports:
      - "8800:8000"

volumes:
  pg_data:
  grafana_data:
  etl_data:

secrets:
  postgres_app_user:
    file: ./secrets/postgres_app_user
  postgres_app_password:
    file: ./secrets/postgres_app_password
  grafana_admin_user:
    file: ./secrets/grafana_admin_user
  grafana_admin_password:
    file: ./secrets/grafana_admin_password
  ibkr_flex_token:
    file: ./secrets/ibkr_flex_token
  ibkr_flex_query_id:
    file: ./secrets/ibkr_flex_query_id
  visualizer_basic_auth_user:
    file: ./secrets/visualizer_basic_auth_user
  visualizer_basic_auth_password:
    file: ./secrets/visualizer_basic_auth_password
